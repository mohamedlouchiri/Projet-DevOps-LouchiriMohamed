name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Debug - List files
      run: |
        echo "=== Structure du projet ==="
        ls -la
        echo "=== Contenu de pom.xml (lignes 10-15) ==="
        sed -n '10,15p' pom.xml || cat pom.xml | Select-String -Pattern "name" -Context 2,2
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Validate pom.xml
      run: |
        echo "=== Validation du pom.xml ==="
        mvn validate || echo "Erreur de validation"
        echo "=== Vérification de la ligne 13 ==="
        sed -n '13p' pom.xml
        
    - name: Build and test with Maven
      run: mvn clean test package
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: jar-artifact
        path: target/*.jar
        if-no-files-found: ignore

